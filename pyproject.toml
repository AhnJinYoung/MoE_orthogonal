[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-orthogonal"
version = "0.1.0"
description = "Inference-time orthogonal expert aggregation experiments for sparse MoE models."
readme = "READMD.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30",
    "datasets>=2.19",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
moe-ortho = "moe_orthogonal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
